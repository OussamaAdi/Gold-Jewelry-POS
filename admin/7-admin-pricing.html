<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>/* Apply the saved theme before the page draws */try{if(localStorage.getItem('gjpos-theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gold Jewelry POS — Pricing</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;--bg5:#333;
  --t1:#fff;--t2:#ccc;--t3:#888;--t4:#555;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.15);
  --gold:#d4a017;--gold-h:#c4930f;--gold-bg:rgba(212,160,23,.15);
  --green:#4caf7c;--green-bg:rgba(76,175,124,.12);
  --red:#e65b5b;--red-bg:rgba(230,91,91,.12);
  --blue:#5ba3e6;--blue-bg:rgba(91,163,230,.12);
  --amber:#e6a23c;--amber-bg:rgba(230,162,60,.12);
  --r:10px;--rl:14px;
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
html.light{
  --bg:#f2f2f4;--bg2:#ffffff;--bg3:#f7f7f8;--bg4:#ededef;--bg5:#e2e2e5;
  --t1:#1a1a1a;--t2:#3a3a3a;--t3:#6b6b70;--t4:#9a9aa0;
  --bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.18);
  --gold:#b8860b;--gold-h:#a4780a;--gold-bg:rgba(184,134,11,.12);
  --green:#2e8b5f;--green-bg:rgba(46,139,95,.1);
  --red:#cf4444;--red-bg:rgba(207,68,68,.1);
  --blue:#3d7fc4;--blue-bg:rgba(61,127,196,.1);
  --amber:#c4821a;--amber-bg:rgba(196,130,26,.1);
}
body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100vh;display:flex;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
.sidebar{width:222px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;transition:background .25s}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(128,128,128,.2)}
.side-brand{height:64px;padding:0 18px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--bd)}
.side-brand-name{font-size:17px;font-weight:700}
.side-brand-name span{color:var(--gold)}
.side-brand-sub{font-size:11px;color:var(--t4);margin-top:2px}
.side-section{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t4);font-weight:600;padding:16px 18px 6px}
.side-item{display:flex;align-items:center;gap:10px;padding:11px 18px;font-size:14px;font-weight:500;color:var(--t3);cursor:pointer;transition:all .12s;border-left:3px solid transparent;user-select:none}
.side-item:hover{color:var(--t2);background:rgba(128,128,128,.05)}
.side-item.active{color:var(--gold);background:var(--gold-bg);border-left-color:var(--gold)}
.side-item .si-ico{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.side-item .si-arrow{margin-left:auto;font-size:10px;color:var(--t4)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--bg2);border-bottom:1px solid var(--bd);gap:12px;transition:background .25s;flex-shrink:0}
.top-title{font-size:19px;font-weight:600}
.top-right{display:flex;align-items:center;gap:10px}
.top-user{font-size:13px;color:var(--t3);display:flex;align-items:center;gap:7px}
.top-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1a1a1a;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mode-btn{font-family:var(--font);font-size:15px;padding:8px 12px;border-radius:var(--r);cursor:pointer;border:1px solid var(--bd2);background:transparent;color:var(--t3);min-height:38px}
.mode-btn:active{transform:scale(.95)}
.content{flex:1;padding:22px 26px;overflow-y:auto;display:flex;align-items:center;justify-content:center}
.content-inner{max-width:820px;width:100%;margin-bottom:6vh}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(128,128,128,.25)}

.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.page-title{font-size:16px;font-weight:600}
.head-note{font-size:12px;color:var(--t4)}
.apply-btn{font-family:var(--font);font-size:14px;font-weight:600;padding:12px 22px;border-radius:var(--r);border:none;background:var(--gold);color:#1a1a1a;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.apply-btn:active{background:var(--gold-h);transform:scale(.97)}
.apply-btn:disabled{background:var(--bg4);color:var(--t4);cursor:not-allowed}

.panel{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rl);padding:14px 16px;transition:background .25s,border-color .25s;margin-bottom:14px}
html.light .panel{border-color:#c9c9cf;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel-title{font-size:14px;font-weight:600;margin-bottom:4px}
.panel-sub{font-size:12px;color:var(--t4);margin-bottom:16px}

.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rl);padding:12px 14px;transition:border-color .2s}
.pcard.changed{border-color:var(--gold)}
.pcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.pcard-karat{font-size:14px;font-weight:700;color:var(--gold)}
.pcard-stock{font-size:11px;color:var(--t4)}
.pcard-input-row{display:flex;align-items:center;gap:8px}
.pcard-cur{font-size:14px;color:var(--t4);font-weight:600}
.pcard input{font-family:var(--font);font-size:17px;font-weight:700;padding:8px 12px;border-radius:var(--r);border:1.5px solid var(--bd2);background:var(--bg4);color:var(--t1);width:100%;-webkit-appearance:none}
.pcard input:focus{outline:none;border-color:var(--gold)}
.pcard-delta{font-size:11px;margin-top:6px;min-height:15px;font-weight:500}
.d-up{color:var(--green)}
.d-down{color:var(--red)}
.d-none{color:var(--t4)}

.impact{display:none;background:var(--gold-bg);border:1px solid rgba(212,160,23,.3);border-radius:var(--r);padding:12px 16px;margin-top:14px;font-size:13px;color:var(--t2)}
.impact.show{display:block}
.impact b{color:var(--gold)}


.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#fff;color:#1a1a1a;padding:14px 28px;border-radius:var(--r);font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:all .35s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
html.light .toast{background:#1f1f1f;color:#fff}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.price-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="side-brand">
    <div class="side-brand-name">Gold <span>Jewelry</span> POS</div>
    <div class="side-brand-sub">Management System</div>
  </div>
  <div class="side-section">Main</div>
  <div class="side-item"><span class="si-ico">🏠</span> Dashboard</div>
  <div class="side-item"><span class="si-ico">📊</span> Reports <span class="si-arrow">▼</span></div>
  <div class="side-item"><span class="si-ico">📦</span> Inventory</div>
  <div class="side-item active"><span class="si-ico">🏷️</span> Pricing</div>
  <div class="side-item"><span class="si-ico">👥</span> Customers</div>
  <div class="side-item"><span class="si-ico"><svg width="17" height="13" viewBox="0 0 16 12" fill="none"><path d="M2 11h12l2-5H4L2 11z" fill="#D4A017" opacity=".35"/><path d="M0 11h12l2-5H2L0 11z" fill="#D4A017"/><path d="M3 6l1-5h6l1 5" fill="#E6B422"/></svg></span> Used gold</div>
  <div class="side-item"><span class="si-ico">↩️</span> Returns management</div>
  <div class="side-item"><span class="si-ico">💼</span> Staff</div>
  <div class="side-section">System</div>
  <div class="side-item"><span class="si-ico">🖥️</span> POS</div>
</nav>

<div class="main">
  <div class="topbar">
    <span class="top-title">Pricing</span>
    <div class="top-right">
      <button class="mode-btn" id="modeBtn" onclick="toggleMode()">☀️</button>
      <span class="top-user"><span class="top-avatar">AD</span> user1@example.com</span>
    </div>
  </div>

  <div class="content">
    <div class="content-inner">
    <div class="page-head">
      <div>
        <div class="page-title">🏷️ Gold pricing</div>
        <div class="head-note">Sell price per gram · CAD · last updated today 9:14 AM by Ari</div>
      </div>
      <button class="apply-btn" id="applyBtn" onclick="applyPrices()" disabled>⟳ No changes</button>
    </div>

    <div class="panel">
      <div class="price-grid" id="priceGrid"></div>
      <div class="impact" id="impactBox"></div>
    </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══ LIGHT / DARK MODE (saved for every page under 'gjpos-theme') ═══
function toggleMode(){
  var light=document.documentElement.classList.toggle('light');
  try{localStorage.setItem('gjpos-theme',light?'light':'dark')}catch(e){}
  document.getElementById('modeBtn').textContent=light?'🌙':'☀️';
}
document.getElementById('modeBtn').textContent=document.documentElement.classList.contains('light')?'🌙':'☀️';
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3000)}
function fmt(n){return'$'+Math.round(n).toLocaleString()}

// current prices + stock on hand per karat (stock value impact)
var PRICES={18:195.00,21:225.00,22:230.00,24:230.00};
var STOCK_G={18:6820,21:11240,22:26.4,24:512};

function renderCards(){
  document.getElementById('priceGrid').innerHTML=[18,21,22,24].map(function(k){
    return '<div class="pcard" id="card'+k+'">'+
      '<div class="pcard-top"><span class="pcard-karat">'+k+'K</span><span class="pcard-stock">'+STOCK_G[k].toLocaleString()+'g in stock</span></div>'+
      '<div class="pcard-input-row"><span class="pcard-cur">$</span><input type="number" id="in'+k+'" value="'+PRICES[k].toFixed(2)+'" step="any" inputmode="decimal" oninput="onEdit()"><span class="pcard-cur">/g</span></div>'+
      '<div class="pcard-delta d-none" id="delta'+k+'">Current price</div>'+
    '</div>';
  }).join('');
}

function getEdits(){
  var edits=[];
  [18,21,22,24].forEach(function(k){
    var v=parseFloat(document.getElementById('in'+k).value);
    if(v>0&&Math.abs(v-PRICES[k])>=0.005)edits.push({k:k,from:PRICES[k],to:v});
  });
  return edits;
}

function onEdit(){
  var edits=getEdits();
  var totalImpact=0;
  [18,21,22,24].forEach(function(k){
    var card=document.getElementById('card'+k);
    var delta=document.getElementById('delta'+k);
    var e=edits.find(function(x){return x.k===k});
    if(e){
      card.classList.add('changed');
      var diff=e.to-e.from;
      var pct=(diff/e.from*100).toFixed(1);
      var impact=diff*STOCK_G[k];
      totalImpact+=impact;
      delta.className='pcard-delta '+(diff>0?'d-up':'d-down');
      delta.textContent='$'+e.from.toFixed(2)+' → $'+e.to.toFixed(2)+' ('+(diff>0?'+':'')+pct+'%) · stock value '+(impact>=0?'+':'−')+fmt(Math.abs(impact));
    }else{
      card.classList.remove('changed');
      delta.className='pcard-delta d-none';
      delta.textContent='Current price';
    }
  });
  var btn=document.getElementById('applyBtn');
  var box=document.getElementById('impactBox');
  if(edits.length){
    btn.disabled=false;
    btn.textContent='✓ Apply '+edits.length+' change'+(edits.length!==1?'s':'');
    box.classList.add('show');
    box.innerHTML='Applying these prices revalues your stock by <b>'+(totalImpact>=0?'+':'−')+fmt(Math.abs(totalImpact))+'</b> ('+fmt(3819557)+' → <b>'+fmt(3819557+totalImpact)+'</b>). POS prices update immediately.';
  }else{
    btn.disabled=true;
    btn.textContent='⟳ No changes';
    box.classList.remove('show');
  }
}

function applyPrices(){
  var edits=getEdits();
  if(!edits.length)return;
  edits.forEach(function(e){PRICES[e.k]=e.to});
  renderCards();onEdit();
  showToast('✓ '+edits.length+' price'+(edits.length!==1?'s':'')+' updated — live on POS now');
}


renderCards();
</script>
<script>
/* Portfolio demo navigation: links the standalone prototype pages together */
(function(){
  var inAdmin = location.pathname.indexOf('/admin/') !== -1;
  var POS = {sale:'2-pos-sale.html', 'return':'3-return-system.html', repair:'4-repair-intake.html',
             pickup:'5-repair-orders.html', usedgold:'6-used-gold.html', cash:'7-cash-management.html'};
  var ADMIN = {'dashboard':'1-admin-dashboard.html','reports':'2-sales-reports.html','sales reports':'2-sales-reports.html',
    'inventory reports':'3-inventory-reports.html','repairs reports':'4-repairs-reports.html',
    'customers reports':'5-customers-reports.html','inventory':'6-admin-inventory.html',
    'pricing':'7-admin-pricing.html','customers':'8-admin-customers.html','used gold':'9-admin-used-gold.html',
    'returns management':'10-admin-returns.html','staff':'11-admin-staff.html','pos':'../pos/1-pos-dashboard.html'};
  function go(url){ location.href = url; }
  if (typeof window.navigate === 'function' && !inAdmin) {
    window.navigate = function(page){ if (POS[page]) go(POS[page]); };
  }
  if (typeof window.showToast === 'function') {
    var orig = window.showToast;
    window.showToast = function(msg){
      var m = String(msg);
      if (/^Back to POS/i.test(m)) return go('1-pos-dashboard.html');
      if (/^Opening Admin Panel/i.test(m)) return go('../admin/1-admin-dashboard.html');
      if (/^Logging out/i.test(m)) return go('../index.html');
      return orig.apply(this, arguments);
    };
  }
  if (inAdmin) {
    document.querySelectorAll('.side-item, .side-sub-item').forEach(function(el){
      if (el.id === 'reportsToggle') return;
      var label = el.textContent.replace(/[^A-Za-z ]/g,'').trim().toLowerCase();
      var target = ADMIN[label];
      if (target) { el.style.cursor = 'pointer'; el.addEventListener('click', function(){ go(target); }); }
    });
  }
})();
</script>
</body>
</html>
